services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: af3
      POSTGRES_PASSWORD: af3
      POSTGRES_DB: af3cache
    ports:
      - "5432:5432"
    volumes:
      - af3cache_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af3 -d af3cache"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  af3cache_pgdata:
