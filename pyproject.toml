[project]
name = "af3-cache"
version = "0.1.0"
description = "FastAPI + Postgres API for the AlphaFold3 MSA alignment cache"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # CVE: Starlette < 1.0.1 didn't validate the Host header before rebuilding
    # request.url (security checks keyed on request.url could be bypassed).
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # >=2.12 for Field(exclude_if=...), used by the /v2/query schemas to omit
    # similarity-only keys from exact-hit responses.
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    # Prometheus /metrics. Chosen over prometheus-fastapi-instrumentator: the
    # metrics that matter here (cache hit ratio, OSDF timing, classifier
    # degradation, pool saturation) need this library directly anyway, so the
    # wrapper would be an ADDITIONAL dependency rather than a replacement.
    "prometheus-client>=0.21",
    # Namespace registry file (app/core/namespaces.py). Already pulled in
    # transitively by uvicorn[standard]; declared so the import is not an accident.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Migrations carry raw DDL (0001 is verbatim from plan.md); line length there
# is not meaningful.
"migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI markers are intentionally called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
