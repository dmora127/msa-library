# af3-cache — Jetstream2 DATABASE deployment (private Postgres 16).
#
# Postgres is bound to 127.0.0.1 only: not reachable from the internet even if
# the security group is misconfigured. The FastAPI app (later) connects either
# as a container on this compose network (host `db`) or via 127.0.0.1:5432.
#
# Data lives on the attached Jetstream2 volume mounted at /mnt/pgdata.
#
#   docker compose -f docker-compose.prod.yml up -d db
#   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
#
# Requires ./.env.prod (copy .env.prod.example, set a strong password).

name: af3cache

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ./.env.prod
    ports:
      - "127.0.0.1:5432:5432"      # localhost-only; DB stays private
    volumes:
      # Long form with create_host_path:false is DELIBERATE and load-bearing.
      # /mnt/pgdata is a symlink to /media/volume/af3-cache-volume, mounted by
      # Exosphere via a udev-triggered unit that has NO ordering relationship to
      # docker.service (and is NOT in /etc/fstab). If Docker wins that boot race,
      # the short form would silently CREATE /mnt/pgdata/data on the root disk and
      # Postgres would initdb an empty cluster -- "a healthy-looking API with no
      # data" (see docs/redeploy.md). With create_host_path:false, Compose errors
      # out and db simply never starts. Fail closed.
      - type: bind
        source: /mnt/pgdata/data
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    # Host has ZERO swap, so an unbounded leak becomes an abrupt kernel OOM kill
    # that picks its victim by heuristic. Observed steady state: ~234 MiB.
    mem_limit: 4g
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  # One-shot schema migrator (alembic upgrade head). Not started by default;
  # run explicitly after `db` is healthy. Built from the repo Dockerfile.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: ./.env.prod
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"
