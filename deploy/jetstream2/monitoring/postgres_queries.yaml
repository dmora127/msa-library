# Custom queries for postgres-exporter, run as the READ-ONLY af3_exporter role.
#
# Architectural line: DB-shaped facts come from here, request-shaped facts come
# from the app's /metrics (Phase 3). This keeps expensive COUNT(*) queries off
# the request path -- GET /v1/stats is 8 scalar subqueries over a 465k-row table
# and must never be scraped every 30s.
#
# EVERY query here is a plain SELECT. Nothing in this file mutates anything.

af3cache_ingestions:
  query: "select status::text as status, count(*) as count from public.msa_ingestions group by 1"
  metrics:
    - status: { usage: "LABEL", description: "ingestion status" }
    - count:  { usage: "GAUGE", description: "ingestions by status" }

af3cache_entries:
  query: "select source, status::text as status, count(*) as count from public.msa_cache_entries group by 1,2"
  metrics:
    - source: { usage: "LABEL", description: "MSA source" }
    - status: { usage: "LABEL", description: "entry status" }
    - count:  { usage: "GAUGE", description: "cache entries by source and status" }

# Data-side detector for the /mnt/pgdata boot race: if Postgres ever comes up on
# an empty root-disk cluster, this collapses to 0 while /healthz still says ok.
# Baseline at 2026-08-22: 465433.
af3cache_entries_total:
  query: "select count(*) as count from public.msa_cache_entries"
  metrics:
    - count: { usage: "GAUGE", description: "total cache entries (volume-loss canary)" }

# READ-ONLY exposure metric for the reaper. Counts what WOULD go stale if the
# maintenance job were ever enabled. It does NOT act, and the maintenance job is
# deliberately NOT scheduled -- see the crontab guardrail and docs/redeploy.md.
# Filtered to sources that actually have a TTL (only 'Community Contributed -
# Cached' does; the other seven are NULL = never culled).
af3cache_reap_exposure:
  query: >
    select e.source,
           count(*) as would_go_stale
    from public.msa_cache_entries e
    join public.msa_sources s on e.source = s.name
    where s.idle_ttl_days is not null
      and e.status = 'active'
      and e.last_accessed_at < now() - make_interval(days => s.idle_ttl_days)
    group by 1
  metrics:
    - source:         { usage: "LABEL", description: "source with a non-null idle_ttl_days" }
    - would_go_stale: { usage: "GAUGE", description: "entries the reaper WOULD delete if enabled" }

af3cache_queries:
  query: "select coalesce(count,0) as count, coalesce(hit_count,0) as hit_count from public.query_metrics where day = current_date"
  metrics:
    - count:     { usage: "GAUGE", description: "queries today" }
    - hit_count: { usage: "GAUGE", description: "sequences served with >=1 hit today" }

# A3M storage consumed on OSDF. 'active' AND 'held' rows both have live objects
# on OSDF -- migration 0014 parks a 'held' entry out of circulation without
# deleting it, so the row and object survive indefinitely. Only 'stale' rows have
# been (or are due to be) reclaimed. Excluding 'held' undercounts real space used
# the moment anything gets parked, which is what threw off the 7d growth/capacity
# panels below the first time entries were flipped to 'held'.
# Measured cost: ~90ms warm (parallel seq scan) at a 30s scrape = ~0.3% duty
# cycle. If msa_cache_entries grows an order of magnitude, move this to a slower
# scrape rather than dropping it.
af3cache_a3m:
  query: >
    select source,
           coalesce(sum(a3m_size_bytes), 0)::bigint as bytes,
           count(*) as entries
    from public.msa_cache_entries
    where status in ('active', 'held')
    group by 1
  metrics:
    - source:  { usage: "LABEL", description: "MSA source" }
    - bytes:   { usage: "GAUGE", description: "bytes of a3m objects held on OSDF (active + held)" }
    - entries: { usage: "GAUGE", description: "active+held entries contributing to that total" }

# Classification state of cache entries, for the NR-BLAST reclassification
# pipeline (docs/redeploy.md, "Reclassification export"). `pending` = the
# sentinel job uploads carry in BOTH fields until the remote BLAST run posts a
# label; `unclassified` = either field 'Unclassified' (outside that pipeline's
# scope); everything else = `classified`. Same full scan as af3cache_entries
# (~100 ms warm). The dashboard's "Classification" row divides by the active
# total for the percentages.
af3cache_classification:
  query: >
    select status::text as status,
           case when species = 'Pending Classification'
                 and query_name = 'Pending Classification' then 'pending'
                when species = 'Unclassified' or query_name = 'Unclassified' then 'unclassified'
                else 'classified' end as state,
           count(*) as count
    from public.msa_cache_entries
    group by 1, 2
  metrics:
    - status: { usage: "LABEL", description: "entry status (active | stale | held)" }
    - state:  { usage: "LABEL", description: "pending | unclassified | classified" }
    - count:  { usage: "GAUGE", description: "cache entries by classification state" }

# Remote NR-BLAST jobs recorded in reclass_jobs. Needs SELECT + an RLS policy
# for af3_exporter (Phase 10 grants). QUEUED/RUNNING = the poller is active.
# A status with no rows has no series: dashboard panels use `or vector(0)`.
af3cache_reclass_jobs:
  query: "select status as status, count(*) as count from public.reclass_jobs group by 1"
  metrics:
    - status: { usage: "LABEL", description: "QUEUED | RUNNING | DONE | FAILED | KILLED | UNKNOWN" }
    - count:  { usage: "GAUGE", description: "reclassification jobs by status" }

# Per-OSDF-namespace usage for the capacity gate's dashboard + alerts
# (grafana/dashboards/af3cache-namespaces.json, af3-namespace-headroom-*).
# used_bytes = observed bytes of published objects that still have a cache
# entry (reaped ones drop out via the FK) + DECLARED bytes of in-flight rows,
# which reserve their space before the object exists. This query text is
# pinned byte-for-byte (modulo whitespace) to NAMESPACE_USAGE_SQL in
# app/services/namespace_capacity.py by tests/test_namespace_capacity.py, so
# the API's gate and this exporter can never disagree about "used". Capacity,
# enabled and accepting come from the app's /metrics (af3cache_namespace_*);
# Grafana joins on `namespace`. Index-only scan over
# msa_ingestions_namespace_status_idx (migration 0016): tens of ms at 750k rows.
af3cache_namespace:
  query: >
    select namespace,
           count(*) filter (where status = 'available' and cache_entry_id is not null) as available_count,
           count(*) filter (where status in ('pending','uploaded'))                    as inflight_count,
           coalesce(sum(observed_size_bytes) filter (where status = 'available' and cache_entry_id is not null), 0)
         + coalesce(sum(declared_size_bytes) filter (where status in ('pending','uploaded')), 0) as used_bytes
      from public.msa_ingestions
     where namespace is not null and status in ('pending','uploaded','available')
     group by namespace
  metrics:
    - namespace:       { usage: "LABEL", description: "OSDF namespace (registry key)" }
    - available_count: { usage: "GAUGE", description: "published objects still holding a cache entry" }
    - inflight_count:  { usage: "GAUGE", description: "pending + uploaded rows (space reserved at declared size)" }
    - used_bytes:      { usage: "GAUGE", description: "bytes counted against the namespace's capacity" }
