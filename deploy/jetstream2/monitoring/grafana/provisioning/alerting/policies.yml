apiVersion: 1
policies:
  - orgId: 1
    receiver: email-ops
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    # Critical alerts re-notify every 4h; everything else every 12h. The point
    # is to stay quiet enough that a single maintainer keeps reading them.
    repeat_interval: 12h
    routes:
      - receiver: email-ops
        object_matchers: [["severity", "=", "critical"]]
        group_wait: 10s
        repeat_interval: 4h
    # One root cause must not produce fifteen emails.
    mute_time_intervals: []
