apiVersion: 1
providers:
  - name: af3cache
    orgId: 1
    folder: af3-cache
    type: file
    disableDeletion: false
    # Provisioned from files so losing the grafana_data volume costs nothing.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
